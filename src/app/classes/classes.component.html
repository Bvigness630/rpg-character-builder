<section class="w4-container">
  <div class="w4-page-intro">
    <p class="w4-eyebrow">Explore</p>
    <h1>Character Classes</h1>
    <p>
      Explore the available classes and find the right fit for your next character.
    </p>
  </div>

  <div class="w4-grid w4-grid-3" data-testid="class-list">
    @for (characterClass of characterClasses; track characterClass.id) {
      <article class="w4-card">
        <p class="w4-kicker">Character Class</p>
        <h2>{{ characterClass.name }}</h2>
        <p>{{ characterClass.description }}</p>

        <a
          class="w4-btn w4-btn-primary"
          [routerLink]="['/classes', characterClass.id]"
        >
          View Details
        </a>
      </article>
    }
  </div>
</section>
